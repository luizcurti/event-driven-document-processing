services:
  localstack:
    image: localstack/localstack:4.1.1
    container_name: document-processing-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sqs,sns,lambda,events,stepfunctions,cloudwatch,logs,iam,kms,sts,apigateway
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=0
      - PERSISTENCE=1
      - LAMBDA_DOCKER_NETWORK=document-processing-local
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - document-processing

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: document-processing-pushgateway
    ports:
      - "9091:9091"
    networks:
      - document-processing

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: document-processing-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - pushgateway
    networks:
      - document-processing

  loki:
    image: grafana/loki:2.9.8
    container_name: document-processing-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3101:3100"
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - document-processing

  promtail:
    image: grafana/promtail:2.9.8
    container_name: document-processing-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - document-processing

  grafana:
    image: grafana/grafana:11.2.0
    container_name: document-processing-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - document-processing

networks:
  document-processing:
    name: document-processing-local

volumes:
  localstack-data:
  prometheus-data:
  loki-data:
  grafana-data:
